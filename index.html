<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Retro Adventure - Hiro Marker</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin:0; overflow:hidden; font-family:Arial,sans-serif; }

    #hud {
      position:fixed; top:12px; left:50%; transform:translateX(-50%);
      z-index:9999; width:92%; max-width:520px;
      display:flex; justify-content:space-between; gap:8px;
      padding:12px 16px; border-radius:16px;
      background:rgba(0,0,0,.78); color:#fff;
      font-weight:bold; font-size:17px;
    }

    #controls {
      position:fixed; left:50%; bottom:12px; transform:translateX(-50%);
      z-index:9999; width:95%; max-width:560px;
      padding:10px; border-radius:20px;
      background:rgba(0,0,0,.80); text-align:center;
    }

    button {
      border:0; border-radius:14px; padding:13px 16px;
      margin:4px; color:#fff; font-size:16px; font-weight:bold;
      touch-action:manipulation; cursor:pointer;
    }
    #jumpBtn { background:#ff9800; }
    #victoryBtn { background:#4caf50; }
    #resetBtn { background:#f44336; }
    #message { color:#00ffcc; font-size:14px; margin-top:5px; }

    #help {
      position:fixed; left:50%; top:62px; transform:translateX(-50%);
      z-index:9998; width:90%; max-width:520px;
      padding:8px 12px; border-radius:12px;
      background:rgba(0,0,0,.55); color:#fff;
      text-align:center; font-size:13px;
    }
  </style>
</head>

<body>
  <div id="hud">
    <div>🪙 COINS: <span id="coinText">0</span></div>
    <div>⭐ SCORE: <span id="scoreText">0</span></div>
    <div>❤️ <span id="lifeText">3</span></div>
  </div>

  <div id="help">🔍 ส่อง Hiro Marker เพื่อเริ่มเกม</div>

  <div id="controls">
    <button id="jumpBtn">🆙 กระโดด / โหม่งเห็ด</button>
    <button id="victoryBtn">✌️ ยก 2 นิ้ว</button>
    <button id="resetBtn">🔄 Reset</button>
    <div id="message">รอการตรวจพบ Hiro Marker...</div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="antialias:true; alpha:true; colorManagement:true"
    arjs="sourceType: webcam; debugUIEnabled:false; detectionMode: mono;">

    <a-light type="ambient" intensity="1.6"></a-light>
    <a-light type="directional" position="2 4 3" intensity="2"></a-light>

    <a-marker preset="hiro" id="hiroMarker">

      <a-entity id="gameWorld" scale="0.85 0.85 0.85">

        <!-- Ground -->
        <a-box position="0 0 0" width="4.2" height="0.18" depth="1.8" color="#4caf50"></a-box>
        <a-box position="0 -0.13 0" width="4.2" height="0.08" depth="1.8" color="#7b4b25"></a-box>

        <!-- Question blocks -->
        <a-box position="0 1.65 0" width="0.45" height="0.45" depth="0.45" color="#ffb300"></a-box>
        <a-text value="?" position="0 1.65 -0.235" align="center" color="#ffffff" width="2"></a-text>

        <a-box position="0.55 1.65 0" width="0.45" height="0.45" depth="0.45" color="#ffb300"></a-box>
        <a-text value="?" position="0.55 1.65 -0.235" align="center" color="#ffffff" width="2"></a-text>

        <!-- Player: retro platform hero, original primitive design -->
        <a-entity id="player" position="-1.35 0.62 0">

          <a-box position="0 0.30 0" width="0.36" height="0.46" depth="0.28" color="#e53935"></a-box>
          <a-sphere position="0 0.67 0" radius="0.22" color="#ffcc99"></a-sphere>
          <a-box position="0 0.84 0" width="0.50" height="0.12" depth="0.32" color="#c62828"></a-box>

          <a-box position="-0.11 0.02 0" width="0.13" height="0.25" depth="0.20" color="#1565c0"></a-box>
          <a-box position="0.11 0.02 0" width="0.13" height="0.25" depth="0.20" color="#1565c0"></a-box>

          <a-box position="-0.25 0.36 0" width="0.12" height="0.30" depth="0.18" color="#ffcc99"></a-box>
          <a-box position="0.25 0.36 0" width="0.12" height="0.30" depth="0.18" color="#ffcc99"></a-box>

          <!-- Victory fingers -->
          <a-entity id="twoFingers" visible="false" position="0.34 0.55 0">
            <a-box position="0 0.12 0" width="0.07" height="0.28" depth="0.07" rotation="0 0 -18" color="#ffcc99"></a-box>
            <a-box position="0.11 0.13 0" width="0.07" height="0.28" depth="0.07" rotation="0 0 18" color="#ffcc99"></a-box>
            <a-box position="0.05 -0.02 0" width="0.18" height="0.14" depth="0.09" color="#ffcc99"></a-box>
          </a-entity>
        </a-entity>

        <!-- Mushroom -->
        <a-entity id="mushroom" position="0.20 0.62 0">
          <a-sphere position="0 0.17 0" radius="0.25" color="#e53935"></a-sphere>
          <a-cylinder position="0 -0.08 0" radius="0.13" height="0.27" color="#eeeeee"></a-cylinder>
          <a-sphere position="-0.10 0.24 -0.18" radius="0.06" color="#ffffff"></a-sphere>
          <a-sphere position="0.10 0.24 -0.18" radius="0.06" color="#ffffff"></a-sphere>
          <a-sphere position="0 0.10 -0.23" radius="0.05" color="#ffffff"></a-sphere>
        </a-entity>

        <!-- Coins -->
        <a-entity id="coin1" position="1.0 1.0 0">
          <a-cylinder rotation="90 0 0" radius="0.15" height="0.06" color="#ffd700"></a-cylinder>
        </a-entity>
        <a-entity id="coin2" position="1.45 1.2 0">
          <a-cylinder rotation="90 0 0" radius="0.15" height="0.06" color="#ffd700"></a-cylinder>
        </a-entity>
        <a-entity id="coin3" position="1.90 1.0 0">
          <a-cylinder rotation="90 0 0" radius="0.15" height="0.06" color="#ffd700"></a-cylinder>
        </a-entity>

        <!-- Floating victory text -->
        <a-text id="victoryText" value="✌ VICTORY!" visible="false"
                position="0 2.15 0" align="center" color="#00ffcc" width="3.5"></a-text>

        <!-- Coin reward popup -->
        <a-text id="rewardText" value="+1 COIN!" visible="false"
                position="0.2 1.55 -0.05" align="center" color="#ffd700" width="2.5"></a-text>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const player = document.getElementById('player');
    const mushroom = document.getElementById('mushroom');
    const coin1 = document.getElementById('coin1');
    const coin2 = document.getElementById('coin2');
    const coin3 = document.getElementById('coin3');
    const victoryText = document.getElementById('victoryText');
    const rewardText = document.getElementById('rewardText');
    const twoFingers = document.getElementById('twoFingers');
    const marker = document.getElementById('hiroMarker');

    const coinText = document.getElementById('coinText');
    const scoreText = document.getElementById('scoreText');
    const lifeText = document.getElementById('lifeText');
    const message = document.getElementById('message');
    const help = document.getElementById('help');

    let coins = 0;
    let score = 0;
    let lives = 3;
    let jumping = false;
    let mushroomAlive = true;
    let markerFound = false;

    function updateUI() {
      coinText.textContent = coins;
      scoreText.textContent = score;
      lifeText.textContent = lives;
    }

    function jumpPlayer() {
      if (!markerFound) {
        message.textContent = '🔍 กรุณาส่อง Hiro Marker ก่อน';
        return;
      }
      if (jumping) return;

      jumping = true;
      message.textContent = '🆙 กระโดด!';

      player.setAttribute('animation__jump', {
        property: 'position',
        to: '-1.35 1.65 0',
        dur: 350,
        easing: 'easeOutQuad'
      });

      setTimeout(() => {
        if (mushroomAlive) hitMushroom();

        player.setAttribute('animation__fall', {
          property: 'position',
          to: '-1.35 0.62 0',
          dur: 400,
          easing: 'easeInQuad'
        });
      }, 350);

      setTimeout(() => {
        jumping = false;
      }, 780);
    }

    function hitMushroom() {
      mushroomAlive = false;
      score += 100;
      coins += 1;
      updateUI();

      mushroom.setAttribute('animation__hit', {
        property: 'scale',
        to: '0 0 0',
        dur: 220,
        easing: 'easeInBack'
      });

      rewardText.setAttribute('visible', 'true');
      rewardText.setAttribute('animation__reward', {
        property: 'position',
        to: '0.2 2.0 -0.05',
        dur: 700,
        easing: 'easeOutQuad'
      });

      message.textContent = '🍄 โหม่งเห็ดสำเร็จ! +100 คะแนน +1 🪙';

      setTimeout(() => {
        rewardText.setAttribute('visible', 'false');
        rewardText.setAttribute('position', '0.2 1.55 -0.05');
      }, 1200);
    }

    function twoFingerVictory() {
      if (!markerFound) {
        message.textContent = '🔍 กรุณาส่อง Hiro Marker ก่อน';
        return;
      }

      score += 50;
      coins += 2;
      updateUI();

      twoFingers.setAttribute('visible', 'true');
      victoryText.setAttribute('visible', 'true');

      player.setAttribute('animation__victory', {
        property: 'rotation',
        to: '0 360 0',
        dur: 800,
        easing: 'easeOutCubic'
      });

      message.textContent = '✌️ Victory! +50 คะแนน +2 🪙';

      setTimeout(() => {
        twoFingers.setAttribute('visible', 'false');
        victoryText.setAttribute('visible', 'false');
        player.setAttribute('rotation', '0 0 0');
      }, 2200);
    }

    function resetGame() {
      coins = 0;
      score = 0;
      lives = 3;
      jumping = false;
      mushroomAlive = true;

      updateUI();

      mushroom.removeAttribute('animation__hit');
      mushroom.setAttribute('scale', '1 1 1');
      mushroom.setAttribute('position', '0.20 0.62 0');

      coin1.setAttribute('visible', 'true');
      coin2.setAttribute('visible', 'true');
      coin3.setAttribute('visible', 'true');

      player.removeAttribute('animation__jump');
      player.removeAttribute('animation__fall');
      player.removeAttribute('animation__victory');
      player.setAttribute('position', '-1.35 0.62 0');
      player.setAttribute('rotation', '0 0 0');

      twoFingers.setAttribute('visible', 'false');
      victoryText.setAttribute('visible', 'false');
      rewardText.setAttribute('visible', 'false');
      rewardText.setAttribute('position', '0.2 1.55 -0.05');

      message.textContent = '🔄 เริ่มเกมใหม่แล้ว';
    }

    marker.addEventListener('markerFound', () => {
      markerFound = true;
      help.textContent = '🎮 พบ Hiro Marker! กดปุ่มเพื่อเล่น';
      message.textContent = '🎮 พร้อมเล่น! กระโดดโหม่งเห็ดเพื่อรับเหรียญ';
    });

    marker.addEventListener('markerLost', () => {
      markerFound = false;
      help.textContent = '🔍 ส่อง Hiro Marker เพื่อเล่นต่อ';
      message.textContent = '⚠️ ไม่พบ Hiro Marker';
    });

    document.getElementById('jumpBtn').addEventListener('click', jumpPlayer);
    document.getElementById('victoryBtn').addEventListener('click', twoFingerVictory);
    document.getElementById('resetBtn').addEventListener('click', resetGame);

    // Keyboard support for desktop testing
    document.addEventListener('keydown', (event) => {
      if (event.code === 'Space') jumpPlayer();
      if (event.key.toLowerCase() === 'v') twoFingerVictory();
      if (event.key.toLowerCase() === 'r') resetGame();
    });

    updateUI();
  </script>
</body>
</html>
